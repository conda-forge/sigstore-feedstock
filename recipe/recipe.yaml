schema_version: 1

context:
  version: "4.5.1"
  python_min: "3.11"

package:
  name: sigstore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sigstore/sigstore-${{ version }}.tar.gz
  sha256: 14accda8a7d4ef47cb25b4903829fb10f011048c261a5937724a43d073c4f34d

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sigstore = sigstore._cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.0,<0.13.0
  run:
    - python >=${{ python_min }}
    - cryptography >=47
    - id >=1.1.0
    - pydantic >=2,<3
    - pyjwt >=2.1
    - requests
    - rich >=13,<16
    - rfc8785 >=0.1.2,<0.2.dev0
    - rfc3161-client >=1.0.3,<1.1.0
    - sigstore-models ==0.0.6
    - sigstore-rekor-types ==0.0.18
    - tuf >=6,<8
    - platformdirs >=4.2,<5.dev0

tests:
  - python:
      imports:
        - sigstore
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - sigstore --help

about:
  summary: A tool for signing Python package distributions
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/sigstore/
  repository: https://github.com/sigstore/sigstore-python
  documentation: https://sigstore.github.io/sigstore-python/

extra:
  recipe-maintainers:
    - travishathaway
    - jezdez
